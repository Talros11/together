<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Together Deal Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* Readability design: Heebo 17/1.6, 8px spacing scale, soft cards, one accent, RTL throughout */
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--r:14px;--r-sm:10px;
  --bg:#f5f6f8;--surface:#ffffff;--surface-2:#f3f5f8;--surface-3:#e9edf2;--text:#1a2230;--muted:#5b6575;
  --line:#e3e7ed;--line-2:#cfd6df;--accent:#2f5bd3;--accent-2:#2449b0;--accent-soft:#e9effd;--on-accent:#ffffff;
  --red:#a8291d;--red-bg:#fcebe8;--amber:#7c4a00;--amber-bg:#fcf0d6;--green:#16653a;--green-bg:#e2f2e8;
  --chip:#eef1f5;--chip-text:#334052;
  --shadow:0 1px 2px rgba(20,30,50,.04),0 4px 14px rgba(20,30,50,.06);--shadow-hover:0 2px 4px rgba(20,30,50,.06),0 10px 28px rgba(20,30,50,.10);
  --panel-shadow:0 12px 48px rgba(20,30,50,.22);--scrim:rgba(20,26,38,.36);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319;--surface:#171c24;--surface-2:#1d2430;--surface-3:#263040;--text:#e8ecf2;--muted:#a3adbb;
    --line:#29313e;--line-2:#3a4557;--accent:#8fb0ff;--accent-2:#b2c8ff;--accent-soft:#1f2c48;--on-accent:#0c1222;
    --red:#ffa498;--red-bg:#3a1b17;--amber:#f2c66f;--amber-bg:#33270f;--green:#86d9aa;--green-bg:#132a1e;
    --chip:#232b37;--chip-text:#d5dbe4;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-hover:0 6px 20px rgba(0,0,0,.45);
    --panel-shadow:0 12px 48px rgba(0,0,0,.6);--scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1319;--surface:#171c24;--surface-2:#1d2430;--surface-3:#263040;--text:#e8ecf2;--muted:#a3adbb;
  --line:#29313e;--line-2:#3a4557;--accent:#8fb0ff;--accent-2:#b2c8ff;--accent-soft:#1f2c48;--on-accent:#0c1222;
  --red:#ffa498;--red-bg:#3a1b17;--amber:#f2c66f;--amber-bg:#33270f;--green:#86d9aa;--green-bg:#132a1e;
  --chip:#232b37;--chip-text:#d5dbe4;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-hover:0 6px 20px rgba(0,0,0,.45);
  --panel-shadow:0 12px 48px rgba(0,0,0,.6);--scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.6 "Heebo",system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;text-align:right}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.3}
h1{font-size:22px;font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:600}
p{margin:0}
bdi{unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:var(--s2);top:-48px;background:var(--surface);padding:var(--s2);z-index:50}
.skip:focus{top:var(--s2)}

/* app shell */
.appbar{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s5);background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .fresh{margin-inline-start:auto;color:var(--muted);font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);min-height:40px;min-width:40px;cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
nav.tabs{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:var(--s2);padding:0 var(--s5);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{display:flex;align-items:center;gap:var(--s2);padding:14px var(--s3);color:var(--muted);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--text)}
nav.tabs a[aria-current="page"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.count{font-size:14px;font-variant-numeric:tabular-nums;background:var(--chip);color:var(--chip-text);border-radius:999px;padding:0 8px;min-width:26px;text-align:center;line-height:22px}
nav.tabs a[aria-current="page"] .count{background:var(--accent-soft);color:var(--accent)}
main{max-width:1320px;margin:0 auto;padding:var(--s5) var(--s5) var(--s7)}
.pagehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s3);margin-bottom:var(--s4)}
.pagehead h2{font-size:28px}
.pagehead p{color:var(--muted);font-size:15px}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-bottom:var(--s4)}
.toolbar .grow{flex:1 1 240px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>header{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.card>header h2{font-size:20px}
.card>header a{margin-inline-start:auto;font-size:15px}
.card .body{padding:var(--s4) var(--s5)}
.empty{color:var(--muted);padding:var(--s5);text-align:center}
.note{color:var(--muted);font-size:15px;max-width:70ch}

/* controls */
input[type=search],select{font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);min-height:44px;padding:0 var(--s3)}
input[type=search]{width:100%}
select.chip{appearance:none;-webkit-appearance:none;border-radius:999px;padding:0 var(--s4);max-width:200px;cursor:pointer;text-overflow:ellipsis;font-size:15px;min-height:40px}
select.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button.chip{font:inherit;font-size:15px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:999px;min-height:40px;padding:0 var(--s4);cursor:pointer;white-space:nowrap}
button.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{font:inherit;font-size:15px;display:inline-flex;align-items:center;gap:var(--s2);min-height:40px;padding:0 var(--s4);border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-2);color:var(--on-accent)}
.btn.link{border-color:transparent;background:transparent;color:var(--accent);padding:0 var(--s2)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--muted);min-height:40px;padding:0 var(--s4);cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rowcount{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}

/* chips and badges */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-size:14px;line-height:22px;background:var(--chip);color:var(--chip-text);white-space:nowrap;font-weight:500}
.tag.soft{background:transparent;border:1px solid var(--line-2)}
.badge{display:inline-flex;align-items:center;border-radius:6px;padding:0 8px;font-size:14px;line-height:22px;font-weight:600;white-space:nowrap;cursor:default}
.badge.est{background:var(--amber-bg);color:var(--amber)}
.badge.ver{background:var(--green-bg);color:var(--green)}
.badge.unv{background:var(--surface-3);color:var(--muted)}
.badge[title]{text-decoration:underline dotted;text-underline-offset:3px}
.prio{display:inline-flex;align-items:center;gap:6px}
.prio .l{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:14px;font-weight:700}
.prio.A .l{background:var(--accent);color:var(--on-accent)}
.prio.B .l{background:var(--accent-soft);color:var(--accent)}
.prio.C .l{background:var(--chip);color:var(--chip-text)}
.tag.prio{padding-inline-start:4px}
.lv-דחוף,.sg-גבוה{background:var(--red-bg);color:var(--red)}
.lv-חשוב,.sg-בינוני{background:var(--amber-bg);color:var(--amber)}
.st-טיוטה{background:var(--amber-bg);color:var(--amber)}
.st-אושר,.st-נשלח,.st-נענה{background:var(--green-bg);color:var(--green)}
.tm-מגייסת{background:var(--green-bg);color:var(--green)}
.tag.pf{background:var(--accent);color:var(--on-accent);font-weight:600}
.warn{color:var(--amber);font-size:15px;font-weight:500}
.src{font-size:14px;color:var(--muted);white-space:nowrap}
.src a{color:var(--muted)}
.src a:hover{color:var(--accent)}

/* company cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--s4)}
a.ccard{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s5);text-decoration:none;color:var(--text);transition:box-shadow .15s,border-color .15s}
a.ccard:hover{box-shadow:var(--shadow-hover);border-color:var(--line-2);color:var(--text)}
.ccard .top{display:flex;align-items:flex-start;gap:var(--s3)}
.ccard h3{font-size:21px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.ccard .what{font-size:16px;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ccard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s1) var(--s3);margin:auto 0 0;font-size:15px;padding-top:var(--s3);border-top:1px solid var(--line)}
.ccard dt{color:var(--muted)}
.ccard dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* data table */
.gridwrap{overflow:auto;max-height:calc(100vh - 240px);min-height:240px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:15px}
.grid th,.grid td{text-align:right;padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:14px;border-bottom:1px solid var(--line-2)}
.grid th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.grid th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid th[aria-sort="ascending"] button::after{content:"▲";font-size:10px}
.grid th[aria-sort="descending"] button::after{content:"▼";font-size:10px}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid tbody tr.sel td{background:var(--accent-soft)}
.grid .first{position:sticky;inset-inline-start:0;z-index:1;background:var(--surface);min-width:240px;max-width:340px;white-space:normal}
.grid thead .first{z-index:3;background:var(--surface-2)}
.grid .first a{font-weight:600;text-decoration:none;color:var(--text)}
.grid .first a:hover{color:var(--accent);text-decoration:underline}
.grid .one{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.grid .wrap{white-space:normal;min-width:160px;max-width:280px}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s4);margin-bottom:var(--s5)}
a.kpi{display:block;padding:var(--s4) var(--s5);text-decoration:none;color:var(--text)}
a.kpi:hover{box-shadow:var(--shadow-hover);color:var(--text)}
.kpi .v{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{color:var(--muted);font-size:15px}
.ov{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--s5);align-items:start}
.ov .side{display:grid;gap:var(--s5)}
.actlist{list-style:none;margin:0;padding:0}
.actlist li+li{border-top:1px solid var(--line)}
.actlist a.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s1) var(--s4);padding:var(--s4) var(--s5);text-decoration:none;color:var(--text)}
.actlist a.row:hover{background:var(--surface-2)}
.actlist .nm{font-weight:700;font-size:18px}
.actlist .sub{color:var(--muted);font-size:15px}
.actlist .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line);align-items:baseline}
.list li:last-child{border-bottom:0}
.list .d{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;min-width:92px;flex:none}
.list .x{min-width:0;overflow-wrap:anywhere}
.freshline{color:var(--muted);font-size:15px;margin-top:var(--s5)}
.freshline summary{cursor:pointer;min-height:32px}
.freshline ul{list-style:none;padding:0;margin:var(--s2) 0;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s5)}
.err{color:var(--red)}

/* signals */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--s1) var(--s4);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .d{color:var(--muted);font-size:15px}
.feed .head{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.feed .co{font-weight:600}
.feed .desc{grid-column:2;max-width:70ch}

/* drafts inbox */
.inbox{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:var(--s5);align-items:start}
.inbox .listpane{position:sticky;top:72px;overflow:hidden}
.inbox ul.items{list-style:none;margin:0;padding:0;max-height:calc(100vh - 320px);overflow-y:auto}
.inbox .item{display:block;padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.inbox .item:hover{background:var(--surface-2)}
.inbox .item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset -4px 0 0 var(--accent)}
.inbox .item .row1{display:flex;gap:var(--s2);align-items:center}
.inbox .item .row1 strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}
.inbox .item .row2{color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);align-items:center}
.reviewed{color:var(--green);font-weight:700}
.draftview>.head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.draftview>.head .pos{margin-inline-start:auto;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--s2) var(--s4);margin:0;padding:var(--s4) var(--s5)}
.facts dt{color:var(--muted);font-size:15px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mail{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);max-width:72ch;text-align:left}
.mail .subj{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
.mail pre{margin:0;padding:var(--s4);white-space:pre-wrap;font:inherit;font-size:16px;line-height:1.65;overflow-wrap:anywhere}
.draftview .mail{margin:0 var(--s5) var(--s4)}
.actions{display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 var(--s5) var(--s4)}
.hint{color:var(--muted);font-size:14px;padding:0 var(--s5) var(--s4)}
.hint kbd{font:inherit;font-size:14px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
.back{display:none}

/* side panel */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.scrim[hidden]{display:none}
/* the panel opens from the physical right edge (the page is RTL, so inset-inline-end would be the left) */
aside.panel{position:fixed;top:0;bottom:0;right:0;left:auto;width:min(920px,100%);background:var(--bg);z-index:31;box-shadow:var(--panel-shadow);display:flex;flex-direction:column;animation:slide-in .22s ease-out}
@keyframes slide-in{from{transform:translateX(100%)}to{transform:none}}
aside.panel[hidden]{display:none}
.panel .ph{padding:var(--s4) var(--s6) var(--s4);background:var(--surface);border-bottom:1px solid var(--line)}
.panel .bar{display:flex;gap:var(--s2);align-items:center;margin-bottom:var(--s3)}
.panel .bar .pos{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;margin-inline-end:auto}
.panel h2{font-size:28px;font-weight:700;overflow-wrap:anywhere}
#p-title:focus{outline:none}
.panel .lede{font-size:17px;margin-top:var(--s2);max-width:70ch}
.panel .ph .chips{margin-top:var(--s3)}
.panel .links{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);font-size:15px;margin-top:var(--s3)}
.jump{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin-top:var(--s4);padding-bottom:2px}
.jump::-webkit-scrollbar{display:none}
.jump a{font-size:14px;white-space:nowrap;text-decoration:none;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:3px 12px}
.jump a:hover{color:var(--accent);border-color:var(--accent)}
.panel .pb{overflow-y:auto;padding:var(--s5) var(--s6) var(--s7);flex:1;display:grid;gap:var(--s4);align-content:start}
.psec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);box-shadow:var(--shadow);scroll-margin-top:var(--s4)}
.psec h3{margin-bottom:var(--s3)}
.psec p,.psec li{max-width:70ch}
.psec p+p{margin-top:var(--s2)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--s2) var(--s4);margin:0}
.kv dt{color:var(--muted);font-size:15px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.quote{margin:var(--s3) 0 0;padding:var(--s3) var(--s4);border-inline-start:3px solid var(--line-2);background:var(--surface-2);border-start-end-radius:var(--r-sm);border-end-end-radius:var(--r-sm);font-size:16px}
.quote .src{display:block;margin-top:var(--s1)}
ul.bul{margin:0;padding-inline-start:22px;display:grid;gap:var(--s3)}
ul.bul li::marker{color:var(--muted)}
ul.bul .why{display:block;color:var(--muted);font-size:15px}
.frows{list-style:none;margin:0;padding:0}
.frows li{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:var(--s1) var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--line);align-items:baseline}
.frows li:last-child{border-bottom:0}
.frows .d{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.frows .main{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);align-items:baseline;min-width:0}
.frows .type{font-weight:600}
.frows .amt{font-weight:700;font-variant-numeric:tabular-nums}
.frows .who{color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.total{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);align-items:baseline;margin-bottom:var(--s3)}

    if (e.target.checked) S.reviewed[d.id] = 1; else delete S.reviewed[d.id]; store.set("reviewed", S.reviewed); drawDraftItems(); }});
  put(v,
    el("div", {class: "head"},
      el("a", {class: "btn back", href: "#drafts"}, "→ חזרה לרשימה"),
      el("h2", {}, bdi(d.company)), pri(d.priority),
      el("span", {class: "pos", "aria-live": "polite"}, i >= 0 ? (i + 1) + " מתוך " + S.dlist.length : ""),
      prev ? el("a", {class: "btn", href: "#draft/" + prev.id, title: "k"}, "→ הקודמת") : el("span", {class: "btn", "aria-disabled": "true"}, "→ הקודמת"),
      next ? el("a", {class: "btn", href: "#draft/" + next.id, title: "j"}, "הבאה ←") : el("span", {class: "btn", "aria-disabled": "true"}, "הבאה ←")),
    draftBlock(d, false),
    el("div", {class: "actions"}, el("label", {style: "display:flex;gap:8px;align-items:center;min-height:40px"}, rv, "עברתי על הטיוטה"),
      el("span", {class: "muted small"}, "(הסימון נשמר רק בדפדפן הזה, לא בגיליון)")),
    el("p", {class: "hint"}, "מקשים: ", el("kbd", {}, "j"), " הבאה · ", el("kbd", {}, "k"), " הקודמת · ", el("kbd", {}, "c"), " העתקת הגוף"));
}

// ---- programs ----
const PCOLS = [
  {k: "name", l: "תוכנית", sort: p => p.name.toLowerCase(), cell: p => el("td", {class: "first"}, el("a", {href: "#program/" + p.id}, bdi(p.name)), known(p.operator) ? el("div", {class: "one"}, mixed(p.operator)) : null)},
  {k: "type", l: "סוג", sort: p => p.type},
  {k: "signal", l: "סיגנל", sort: p => SIGORD[p.signal] ?? 9, cell: p => el("td", {}, tag(p.signal, "sg-" + p.signal))},
  {k: "status", l: "סטטוס", sort: p => p.status, cls: "wrap"},
  {k: "next_open", l: "הרשמה נפתחת", sort: p => p.next_open || "9999", cell: p => dateCell(p.next_open)},
  {k: "next_close", l: "הרשמה נסגרת", sort: p => p.next_close || "9999", cell: p => dateCell(p.next_close)},
  {k: "demo", l: "יום הדגמה", sort: p => p.demo || "9999", cell: p => dateCell(p.demo)},
  {k: "n", l: "חברות שלנו", sort: p => -p.companies.length, cell: p => el("td", {class: "num"}, p.companies.length ? el("a", {href: "#program/" + p.id}, p.companies.length) : "0")},
  {k: "url", l: "רשימת משתתפים", sort: p => p.url ? 0 : p.no_list ? 1 : 2, cell: p => el("td", {}, p.url ? srcLink(p.url) : el("span", {class: "muted"}, p.no_list ? "לא מתפרסמת" : "—"))}
];
function filteredPrograms(){
  const f = S.pf, q = f.q.trim().toLowerCase();
  let list = D.programs_all.filter(p => (f.split || p.status !== "פוצלה") && (!q || p.name.toLowerCase().includes(q) || p.operator.toLowerCase().includes(q)) &&
    (!f.type || p.type === f.type) && (!f.signal || p.signal === f.signal) && (!f.status || p.status === f.status));
  if (S.psort.k) { const col = PCOLS.find(c => c.k === S.psort.k);
    list = list.slice().sort((a, b) => { const x = col.sort(a), y = col.sort(b); return S.psort.dir * (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "he")); }); }
  return list;
}
function renderPrograms(){
  const v = $("view"), all = D.programs_all;
  const uniq = k => [...new Set(all.map(p => p[k]))].filter(x => x !== U).sort((a, b) => a.localeCompare(b, "he")).concat(all.some(p => p[k] === U) ? [U] : []);
  const sel = (k, label, vals) => el("select", {class: "chip" + (S.pf[k] ? " on" : ""), "aria-label": label, onchange: e => { S.pf[k] = e.target.value; renderPrograms(); }},
    el("option", {value: ""}, label + ": הכל"), vals.map(x => el("option", {value: x, selected: S.pf[k] === x}, label + ": " + x)));
  const ev = D.programs.events;
  put(v,
    el("div", {class: "pagehead"}, el("h2", {}, "תוכניות"), el("p", {id: "prowcount", class: "rowcount", "aria-live": "polite"})),
    el("section", {class: "card", style: "margin-bottom:24px", "aria-labelledby": "h-pev"},
      el("header", {}, el("h2", {id: "h-pev"}, "תאריכים קרובים"), el("span", {class: "muted small"}, D.programs.days + " הימים הקרובים")),
      el("div", {class: "body"}, ev.length ? el("ul", {class: "list"}, ev.map(e => el("li", {}, el("span", {class: "d"}, dateEl(e.date)),
        el("span", {class: "x"}, e.kind, ": ", el("a", {href: "#program/" + e.pid}, mixed(e.program)), " ", tag(e.signal, "sg-" + e.signal)))))
        : el("p", {class: "muted"}, "אין תאריכים ידועים בטווח הזה"))),
    el("div", {class: "toolbar"},
      el("div", {class: "grow"}, el("input", {type: "search", id: "pq", placeholder: "חיפוש תוכנית או מפעיל", "aria-label": "חיפוש תוכניות", value: S.pf.q,
        oninput: e => { S.pf.q = e.target.value; drawPrograms(); }}))),
    el("div", {class: "toolbar", role: "group", "aria-label": "סינון תוכניות"},
      sel("type", "סוג", uniq("type")), sel("signal", "סיגנל", ["גבוה", "בינוני", "נמוך"].filter(x => all.some(p => p.signal === x))),
      sel("status", "סטטוס", uniq("status").filter(x => x !== "פוצלה")),
      el("button", {type: "button", class: "chip", "aria-pressed": String(S.pf.split), onclick: () => { S.pf.split = !S.pf.split; renderPrograms(); }}, "כולל שורות שפוצלו")),
    el("div", {id: "pbody"}));
  drawPrograms();
}
function drawPrograms(){
  const list = filteredPrograms();
  $("prowcount").textContent = list.length + " תוכניות";
  put($("pbody"), el("div", {class: "gridwrap"}, el("table", {class: "grid"},
    el("caption", {class: "sr"}, "תוכניות; לחיצה על כותרת ממיינת"),
    el("thead", {}, el("tr", {}, PCOLS.map(col => el("th", {scope: "col", class: col.k === "name" ? "first" : null,
      "aria-sort": S.psort.k === col.k ? (S.psort.dir > 0 ? "ascending" : "descending") : null},
      el("button", {type: "button", onclick: () => { S.psort = {k: col.k, dir: S.psort.k === col.k ? -S.psort.dir : 1}; drawPrograms(); }}, col.l))))),
    el("tbody", {}, list.length ? list.map(p => el("tr", {}, PCOLS.map(col => col.cell ? col.cell(p) : el("td", {class: col.cls || null}, p[col.k]))))
      : el("tr", {}, el("td", {colspan: PCOLS.length, class: "empty"}, "אין תוכניות שתואמות לסינון"))))));
}

// ---- signals ----
function renderSignals(){
  const v = $("view"), rows = D.signals.map(i => D.signal_rows[i]);
  const types = [...new Set(rows.map(s => s.type))].sort((a, b) => a.localeCompare(b, "he"));
  const sel = (k, label, vals) => el("select", {class: "chip" + (S.sf[k] ? " on" : ""), "aria-label": label, onchange: e => { S.sf[k] = e.target.value; renderSignals(); }},
    el("option", {value: ""}, label + ": הכל"), vals.map(x => el("option", {value: x, selected: S.sf[k] === x}, label + ": " + x)));
  const q = S.sf.q.trim().toLowerCase();
  const list = rows.filter(s => (!S.sf.level || s.level === S.sf.level) && (!S.sf.type || s.type === S.sf.type) &&
    (!q || s.desc.toLowerCase().includes(q) || (s.cid && byId[s.cid] && byId[s.cid].name.toLowerCase().includes(q))));
  S.nav = [...new Set(list.map(s => s.cid).filter(c => c && byId[c]))];
  put(v,
    el("div", {class: "pagehead"}, el("h2", {}, "אותות"), el("p", {class: "rowcount", "aria-live": "polite"}, list.length + " אותות ב-30 הימים האחרונים")),
    el("div", {class: "toolbar"},
      el("div", {class: "grow"}, el("input", {type: "search", id: "sq", placeholder: "חיפוש באותות", "aria-label": "חיפוש אותות", value: S.sf.q,
        oninput: e => { S.sf.q = e.target.value; const pos = e.target.selectionStart; renderSignals(); const n = $("sq"); n.focus(); n.setSelectionRange(pos, pos); }})),
      sel("level", "רמה", D.levels), sel("type", "סוג", types)),
    el("section", {class: "card"}, list.length ? el("ul", {class: "feed"}, list.map(s => el("li", {},
      el("span", {class: "d"}, dateEl(s.date)),
      el("div", {class: "head"}, lvl(s.level), el("span", {class: "muted small"}, s.type),
        s.cid && byId[s.cid] ? el("a", {class: "co", href: "#company/" + s.cid + "/signals"}, bdi(byId[s.cid].name)) : null),
      el("p", {class: "desc"}, mixed(s.desc), " ", srcLink(s.url)))))
      : el("p", {class: "empty"}, "אין אותות שתואמים לסינון")));
}

// ---- boot ----
function boot(d){
  for (const k of ["companies", "signal_rows"]) d[k] = d[k].rows.map(r => Object.fromEntries(d[k].cols.map((c, i) => [c, r[i]])));
  D = d;
  byId = Object.fromEntries(D.companies.map(c => [c.id, c]));
  progById = Object.fromEntries(D.programs_all.map(p => [p.id, p]));
  draftById = Object.fromEntries(D.drafts.map(x => [x.id, x]));
  put($("fresh"), "עודכן ", bdi(fmtStamp(D.generated_at)), " · " + D.header.sentence);
  route();
}
Promise.resolve(JSON.parse(document.getElementById("embedded").textContent))
  .then(boot)
  .catch(e => { console.error(e); $("fresh").textContent = "לא הצלחתי לטעון את הנתונים (data.json)."; });
</script>
</body>
</html>
