<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Together Deal Flow</title>
<style>
/* D64 design system: neutral palette, one accent, 4/8px spacing scale, tabular numbers */
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r:8px;
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#f2f4f7;--surface-3:#e9ecf1;--text:#111827;--muted:#556070;
  --line:#e2e6ec;--line-2:#cfd5de;--accent:#2a55c9;--accent-2:#1f44a8;--accent-soft:#e8eefc;--on-accent:#ffffff;
  --red:#b42318;--red-bg:#fdecea;--amber:#8a4b00;--amber-bg:#fdf1d9;--green:#17703f;--green-bg:#e3f3ea;
  --chip:#eef0f4;--chip-text:#374151;--shadow:0 1px 2px rgba(16,24,40,.05);--panel-shadow:0 8px 32px rgba(16,24,40,.18);
  --scrim:rgba(17,24,39,.32);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117;--surface:#151a22;--surface-2:#1b212b;--surface-3:#242c38;--text:#e7eaf0;--muted:#9ea8b7;
    --line:#262e3a;--line-2:#364152;--accent:#86a8ff;--accent-2:#a9c1ff;--accent-soft:#1d2b4a;--on-accent:#0b1020;
    --red:#ff9b8f;--red-bg:#3b1915;--amber:#f3c46b;--amber-bg:#33260c;--green:#7bd6a4;--green-bg:#11291d;
    --chip:#232a35;--chip-text:#d3d9e2;--shadow:none;--panel-shadow:0 8px 32px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117;--surface:#151a22;--surface-2:#1b212b;--surface-3:#242c38;--text:#e7eaf0;--muted:#9ea8b7;
  --line:#262e3a;--line-2:#364152;--accent:#86a8ff;--accent-2:#a9c1ff;--accent-soft:#1d2b4a;--on-accent:#0b1020;
  --red:#ff9b8f;--red-bg:#3b1915;--amber:#f3c46b;--amber-bg:#33260c;--green:#7bd6a4;--green-bg:#11291d;
  --chip:#232a35;--chip-text:#d3d9e2;--shadow:none;--panel-shadow:0 8px 32px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
a{color:var(--accent)}
a:hover{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:16px;font-weight:700}
h2{font-size:15px;font-weight:650}
h3{font-size:13px;font-weight:650;color:var(--muted)}
.num,time,td.n{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:var(--s2);top:-40px;background:var(--surface);padding:var(--s2);z-index:50}
.skip:focus{top:var(--s2)}

/* app shell */
.appbar{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s5);background:var(--surface);border-bottom:1px solid var(--line);min-height:48px}
.appbar .fresh{margin-inline-start:auto;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.iconbtn{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line-2);border-radius:var(--r);min-height:32px;min-width:32px;padding:0 var(--s2);cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
nav.tabs{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:var(--s1);padding:0 var(--s4);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{display:flex;align-items:center;gap:6px;padding:12px var(--s3);color:var(--muted);text-decoration:none;font-weight:550;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--text)}
nav.tabs a[aria-current="page"]{color:var(--text);border-bottom-color:var(--accent)}
.count{font-size:12px;font-variant-numeric:tabular-nums;background:var(--chip);color:var(--chip-text);border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
nav.tabs a[aria-current="page"] .count{background:var(--accent-soft);color:var(--accent)}
main{max-width:1440px;margin:0 auto;padding:var(--s4) var(--s5) var(--s6)}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-bottom:var(--s3)}
.toolbar .grow{flex:1 1 200px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>header{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.card>header a{margin-inline-start:auto;font-size:13px}
.card .body{padding:var(--s3) var(--s4)}
.empty{color:var(--muted);padding:var(--s5) var(--s4);text-align:center}

/* controls */
input[type=search],select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);min-height:32px;padding:0 var(--s2)}
input[type=search]{width:100%;padding:0 var(--s3)}
select.chip{appearance:none;-webkit-appearance:none;border-radius:999px;padding:0 var(--s3);background:var(--surface);max-width:170px;cursor:pointer;text-overflow:ellipsis}
select.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
button.chip{font:inherit;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:999px;min-height:32px;padding:0 var(--s3);cursor:pointer;white-space:nowrap}
button.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn{font:inherit;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 var(--s3);border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-2);color:var(--on-accent)}
.btn.link{border-color:transparent;background:transparent;color:var(--accent);padding:0 var(--s1)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{font:inherit;border:0;background:var(--surface);color:var(--muted);min-height:30px;padding:0 var(--s3);cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--panel-shadow);padding:var(--s2);min-width:200px;display:grid;gap:2px}
details.menu label{display:flex;gap:var(--s2);align-items:center;padding:4px var(--s2);border-radius:6px;cursor:pointer;min-height:28px}
details.menu label:hover{background:var(--surface-2)}
.rowcount{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* chips */
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:0 6px;font-size:12px;line-height:20px;background:var(--chip);color:var(--chip-text);white-space:nowrap;font-weight:550}
.pr-A{background:var(--accent);color:var(--on-accent)}
.pr-B{background:var(--accent-soft);color:var(--accent)}
.lv-דחוף,.sg-גבוה{background:var(--red-bg);color:var(--red)}
.lv-חשוב,.sg-בינוני{background:var(--amber-bg);color:var(--amber)}
.st-טיוטה{background:var(--amber-bg);color:var(--amber)}
.st-אושר,.st-נשלח,.st-נענה,.prec-מאומת{background:var(--green-bg);color:var(--green)}
.flag{color:var(--amber);font-size:12px;font-weight:600}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);vertical-align:middle}

/* data grid */
.gridwrap{overflow:auto;max-height:calc(100vh - 210px);min-height:240px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.grid th,.grid td{text-align:start;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line-2)}
.grid th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.grid th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid th[aria-sort="ascending"] button::after{content:"▲";font-size:9px}
.grid th[aria-sort="descending"] button::after{content:"▼";font-size:9px}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid tbody tr.sel td{background:var(--accent-soft)}
.grid .first{position:sticky;inset-inline-start:0;z-index:1;background:var(--surface);min-width:240px;max-width:320px;white-space:normal}
.grid thead .first{z-index:3;background:var(--surface-2)}
.grid .first a{font-weight:600;text-decoration:none;color:var(--text)}
.grid .first a:hover{color:var(--accent);text-decoration:underline}
.grid .one{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.grid .wrap{white-space:normal;min-width:160px;max-width:260px}
.grid td.n{text-align:end}

/* pipeline */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:var(--s3);overflow-x:auto;padding-bottom:var(--s2)}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2);min-width:0}
.lane h2{display:flex;justify-content:space-between;padding:var(--s1) var(--s1) var(--s2);font-size:13px}
.lane ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2);max-height:calc(100vh - 260px);overflow-y:auto}
.kcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);text-decoration:none;color:var(--text)}
.kcard:hover{border-color:var(--accent)}
.kcard strong{display:block}
.kcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.kpi{display:block;padding:var(--s3) var(--s4);text-decoration:none;color:var(--text)}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{color:var(--muted);font-size:12px}
.ov{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--s4);align-items:start}
.ov .side{display:grid;gap:var(--s4)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:var(--s2);padding:var(--s2) 0;border-bottom:1px solid var(--line);align-items:baseline}
.list li:last-child{border-bottom:0}
.list .d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:74px}
.list .x{min-width:0;overflow-wrap:anywhere}
.freshline{color:var(--muted);font-size:12px;margin-top:var(--s4)}
.freshline summary{cursor:pointer;min-height:24px}
.freshline ul{list-style:none;padding:0;margin:var(--s2) 0;display:flex;flex-wrap:wrap;gap:4px var(--s4)}
.err{color:var(--red)}
.note{background:var(--amber-bg);color:var(--amber);border-radius:var(--r);padding:var(--s2) var(--s3);margin-bottom:var(--s3);font-size:13px}

/* signals feed */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:84px 56px minmax(0,1fr);gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);align-items:baseline}
.feed li:last-child{border-bottom:0}
.feed .co{font-weight:600}

/* drafts inbox */
.inbox{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:var(--s4);align-items:start}
.inbox .listpane{position:sticky;top:56px}
.inbox ul.items{list-style:none;margin:0;padding:0;max-height:calc(100vh - 250px);overflow-y:auto}
.inbox .item{display:block;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.inbox .item:hover{background:var(--surface-2)}
.inbox .item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset -3px 0 0 var(--accent)}
.inbox .item .row1{display:flex;gap:var(--s2);align-items:center}
.inbox .item .row1 strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inbox .item .row2{color:var(--muted);font-size:12px;display:flex;gap:var(--s2)}
.reviewed{color:var(--green);font-weight:700}
.draftview .head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.draftview .head .pos{margin-inline-start:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.fields{display:grid;grid-template-columns:90px minmax(0,1fr);gap:var(--s2) var(--s3);padding:var(--s3) var(--s4);margin:0}
.fields dt{color:var(--muted);font-size:12px;padding-top:2px}
.fields dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mail{border:1px solid var(--line);border-radius:var(--r);margin:0 var(--s4) var(--s3);background:var(--surface-2)}
.mail .subj{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);font-weight:600}
.mail pre{margin:0;padding:var(--s3);white-space:pre-wrap;font:inherit;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 var(--s4) var(--s3)}
.hint{color:var(--muted);font-size:12px;padding:0 var(--s4) var(--s3)}
.hint kbd{font:inherit;font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
.back{display:none}

/* side panel */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.scrim[hidden]{display:none}
aside.panel{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(640px,100%);background:var(--surface);z-index:31;box-shadow:var(--panel-shadow);display:flex;flex-direction:column;border-inline-start:1px solid var(--line)}
aside.panel[hidden]{display:none}
.panel .ph{padding:var(--s3) var(--s4) 0;border-bottom:1px solid var(--line)}
.panel .bar{display:flex;gap:var(--s2);align-items:center;margin-bottom:var(--s2)}
.panel .bar .pos{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;margin-inline-end:auto}
.panel h2{font-size:20px;font-weight:700}
.panel .chips{display:flex;flex-wrap:wrap;gap:6px;margin:var(--s2) 0;align-items:center}
.panel .links{display:flex;flex-wrap:wrap;gap:var(--s3);font-size:13px;margin-bottom:var(--s2)}
.ptabs{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none}
.ptabs button{font:inherit;border:0;background:none;color:var(--muted);padding:var(--s2) var(--s3);border-bottom:2px solid transparent;cursor:pointer;font-weight:550;white-space:nowrap;min-height:36px}
.ptabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.panel .pb{overflow-y:auto;padding:var(--s4);flex:1}
.panel .pb section+section{margin-top:var(--s5)}
.panel .pb h3{margin-bottom:var(--s2)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:var(--s2) var(--s3);margin:0}
.kv dt{color:var(--muted);font-size:12px;padding-top:2px}
.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.panel ul.plain{margin:0;padding-inline-start:18px}
.panel ul.plain li{margin:4px 0;overflow-wrap:anywhere}

/* responsive */
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ov{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .appbar{padding:var(--s2) var(--s4)}
  .appbar .fresh{display:none}
  nav.tabs{padding:0 var(--s2)}
  main{padding:var(--s3) var(--s4) var(--s6)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
  .kpi .v{font-size:22px}
  .gridwrap{max-height:70vh}
  .grid .first{min-width:180px;max-width:220px}
  .inbox{grid-template-columns:minmax(0,1fr)}
  .inbox .listpane{position:static}
  .inbox.has-sel .listpane{display:none}
  .inbox:not(.has-sel) .draftview{display:none}
  .inbox ul.items{max-height:none}
  .back{display:inline-flex}
  .feed li{grid-template-columns:auto auto minmax(0,1fr);padding:var(--s2) var(--s3)}
  .feed li .x{grid-column:1/-1}
  .fields,.kv{grid-template-columns:minmax(0,1fr)}
  .fields dt,.kv dt{padding-top:var(--s2)}
  select.chip{max-width:150px}
  .kanban{grid-auto-columns:minmax(230px,82%)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">דילוג לתוכן</a>
<div id="app">
<header class="appbar">
  <h1>Together Deal Flow</h1>
  <span class="fresh" id="fresh">טוען נתונים…</span>
  <button type="button" class="iconbtn" id="theme" aria-label="ערכת צבעים">◐</button>
</header>
<nav class="tabs" aria-label="אזורים" id="tabs"></nav>
<main id="main" tabindex="-1"><div id="view"></div></main>
</div>

function draftCard(d, compact){

Promise.resolve(JSON.parse(document.getElementById("embedded").textContent))
